domain: settlement
version: 1
description: "정산 도메인 온톨로지 — 가맹점 거래 집계, 정산 생성·승인·지급 프로세스"

object_types:
  - name: Merchant
    description: "정산을 받는 가맹점/판매자"
    properties:
      - name: merchant_id
        type: string
        primary: true
      - name: name
        type: string
      - name: bank_account
        type: string
      - name: fee_rate
        type: float
      - name: settlement_cycle
        type: string
        description: "정산 주기. 허용값: daily, weekly, monthly"

  - name: Transaction
    description: "가맹점이 처리한 개별 거래 건 (결제·환불·조정 포함)"
    properties:
      - name: transaction_id
        type: string
        primary: true
      - name: transaction_type
        type: string
        description: "거래 유형. 허용값: payment, refund, adjustment"
      - name: amount
        type: float
      - name: status
        type: string
        description: "허용값: authorized → captured → settled → cancelled / refunded"
      - name: created_at
        type: datetime

  - name: Settlement
    description: "특정 기간의 거래를 집계한 정산 배치"
    properties:
      - name: settlement_id
        type: string
        primary: true
      - name: period_start
        type: datetime
      - name: period_end
        type: datetime
      - name: status
        type: string
        description: "허용값: pending → calculated → approved / held → disbursed / cancelled"
      - name: total_amount
        type: float
        computed: true
        expression: "SUM(settlement_items.gross_amount)"
      - name: fee_amount
        type: float
        computed: true
        expression: "SUM(settlement_items.fee)"
      - name: net_amount
        type: float
        computed: true
        expression: "total_amount - fee_amount"

  - name: SettlementItem
    description: "정산에 포함된 거래별 정산 항목 (원거래 참조, audit trail)"
    properties:
      - name: item_id
        type: string
        primary: true
      - name: item_type
        type: string
        description: "항목 유형. 허용값: debit(매출), credit(환불차감), fee(수수료), adjustment(조정)"
      - name: gross_amount
        type: float
      - name: fee
        type: float
        description: "수수료 금액. 항상 양수(≥0). credit 항목의 경우 수수료 환급 여부는 비즈니스 정책에 따름"
      - name: net_amount
        type: float
        computed: true
        expression: "gross_amount - fee"
        description: "gross_amount가 음수(credit)이면 net_amount도 음수. fee는 항상 차감 방향"

  - name: Disbursement
    description: "정산 승인 후 가맹점에게 이루어지는 지급 처리"
    properties:
      - name: disbursement_id
        type: string
        primary: true
      - name: amount
        type: float
      - name: status
        type: string
        description: "허용값: pending → processing → completed / failed → retrying"
      - name: retry_count
        type: integer
        description: "지급 재시도 횟수 (0 = 최초 시도)"
      - name: paid_at
        type: datetime

link_types:
  - name: generates
    from: Merchant
    to: Transaction
    cardinality: one_to_many
    description: "가맹점에서 거래가 발생"

  - name: receives_settlement
    from: Merchant
    to: Settlement
    cardinality: one_to_many
    description: "가맹점이 정산을 수령"

  - name: includes
    from: Settlement
    to: SettlementItem
    cardinality: one_to_many
    description: "정산이 정산 항목들을 포함"

  - name: references
    from: SettlementItem
    to: Transaction
    cardinality: one_to_one
    description: "정산 항목이 원거래를 참조"

  - name: paid_via
    from: Settlement
    to: Disbursement
    cardinality: one_to_many
    description: "정산이 지급 처리를 통해 지급됨 (재시도/부분지급 포함)"

  - name: refunds
    from: Transaction
    to: Transaction
    cardinality: one_to_many
    description: "원거래(payment)에 대한 환불/조정 거래 자기참조 (refund/adjustment만 해당)"

action_types:
  - name: calculate_settlement
    description: "특정 기간의 captured 상태 거래를 집계하여 정산을 생성. 해당 거래의 status를 settled로 변경"
    trigger: manual
    target: Settlement
    parameters:
      - name: merchant_id
        type: string
        required: true
      - name: period_start
        type: datetime
        required: true
      - name: period_end
        type: datetime
        required: true

  - name: approve_settlement
    description: "calculated 상태 정산을 검토 후 approved로 변경"
    trigger: manual
    target: Settlement
    parameters:
      - name: settlement_id
        type: string
        required: true

  - name: reject_settlement
    description: "정산을 거부/반려하여 cancelled 상태로 변경"
    trigger: manual
    target: Settlement
    parameters:
      - name: settlement_id
        type: string
        required: true
      - name: rejection_reason
        type: string
        required: true

  - name: hold_settlement
    description: "리스크/규정 위반 사유로 정산을 held 상태로 보류"
    trigger: manual
    target: Settlement
    parameters:
      - name: settlement_id
        type: string
        required: true
      - name: hold_reason
        type: string
        required: true

  - name: release_settlement
    description: "보류(held) 상태의 정산을 해제하여 approved 상태로 전환"
    trigger: manual
    target: Settlement
    parameters:
      - name: settlement_id
        type: string
        required: true

  - name: create_disbursement
    description: "Settlement.status가 calculated→approved로 변경될 때 Disbursement(pending)를 생성"
    trigger: object_updated
    trigger_condition:
      field: status
      from: calculated
      to: approved
    target: Settlement
    parameters:
      - name: settlement_id
        type: string
        required: true

  - name: complete_settlement
    description: "Disbursement.status가 processing→completed로 변경될 때 Settlement.status를 disbursed로 전환"
    trigger: object_updated
    trigger_condition:
      field: status
      from: processing
      to: completed
    target: Disbursement
    parameters:
      - name: disbursement_id
        type: string
        required: true

  - name: retry_disbursement
    description: "실패(failed)한 Disbursement를 재시도하여 retry_count를 증가시키고 새 지급 요청을 생성"
    trigger: manual
    target: Disbursement
    parameters:
      - name: disbursement_id
        type: string
        required: true
